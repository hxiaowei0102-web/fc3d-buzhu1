name: FC3D Auto Update

on:
  schedule:
    # 北京 22:00 = UTC 14:00
    - cron: '0 14 * * *'
    # 北京 23:30 = UTC 15:30
    - cron: '30 15 * * *'
    # 北京 01:00 = UTC 17:00
    - cron: '0 17 * * *'
  workflow_dispatch:  # 手动触发

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Fetch & Predict
        run: python fetch_and_predict.py

      - name: Check output
        run: |
          cat predict.json
          echo "---"
          ls -la data.csv index.html predict.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.csv predict.json index.html
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "auto: $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
