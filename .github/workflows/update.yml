name: FC3D Auto Update

on:
  schedule:
    - cron: '0 14 * * *'
    - cron: '30 15 * * *'
    - cron: '0 17 * * *'
  workflow_dispatch:

concurrency:
  group: fc3d-update
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: install deps
        run: pip install requests --quiet

      - name: run update
        run: python fetch_and_predict.py

      - name: commit changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data.csv predict.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "auto $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')"
            git push origin main
          fi

      - name: upload pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          name: github-pages

      - name: deploy pages
        id: deployment
        uses: actions/deploy-pages@v4
