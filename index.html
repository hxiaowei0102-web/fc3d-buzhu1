<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>福彩3D 不组一</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif;background:#f5f5f5;color:#222;padding:12px;max-width:500px;margin:0 auto}
h1{text-align:center;font-size:20px;color:#c0392b;margin:12px 0 4px}
.sub{text-align:center;font-size:12px;color:#999;margin-bottom:16px}
.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.issue{text-align:center;font-size:16px;color:#555;margin-bottom:16px}
.issue b{color:#c0392b}
.pred-box{text-align:center;padding:28px 16px;border-radius:12px;background:linear-gradient(135deg,#fff5f5,#ffe8e8);border:2px solid #e74c3c}
.pred-label{font-size:14px;color:#888;margin-bottom:8px}
.pred-label span{background:#ffe8e8;color:#e74c3c;padding:1px 8px;border-radius:8px;font-size:11px;margin-left:4px}
.pred-num{font-size:56px;font-weight:bold;color:#e74c3c;letter-spacing:4px}
.pred-mean{font-size:13px;color:#999;margin-top:10px}
.last-draw{text-align:center;font-size:13px;color:#666;padding:8px}
.last-draw b{font-size:18px;color:#333;margin:0 4px}
.acc-row{display:flex;justify-content:center;gap:24px;padding:14px}
.acc-item{text-align:center}
.acc-num{font-size:30px;font-weight:bold;color:#e74c3c}
.acc-label{font-size:11px;color:#999;margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
th{background:#f0f0f0;padding:8px 4px;text-align:center;font-weight:600;color:#555;position:sticky;top:0}
td{padding:6px 4px;text-align:center;border-bottom:1px solid #f0f0f0}
.hit{color:#27ae60;font-weight:bold}
.miss{color:#e74c3c;font-weight:bold}
.table-wrap{max-height:55vh;overflow-y:auto;-webkit-overflow-scrolling:touch;border-radius:8px}
.footer{text-align:center;font-size:10px;color:#bbb;padding:12px}
.footer span{color:#27ae60;font-weight:bold}
.error{text-align:center;padding:40px;color:#999}
.error .big{font-size:60px;margin-bottom:10px}
.refresh{display:block;margin:16px auto;padding:10px 30px;background:#c0392b;color:#fff;border:none;border-radius:8px;font-size:14px}
</style>
</head>
<body>
<h1>福彩3D 不组一预测</h1>
<div class="sub">同数字两码(杀对子) · 云端自动更新</div>

<div id="app">
<div id="loading" style="text-align:center;padding:40px;color:#999">加载中...</div>
</div>

<script>
async function load(){
 try{
  const r=await fetch('predict.json?t='+Date.now());
  const d=await r.json();
  const bt=d.backtest||{};
  const rows=(bt.rows||[]).map(r=>`<tr>
    <td>${r.issue}</td><td><b>${r.draw}</b></td><td>${r.pred}</td>
    <td class="${r.hit?'hit':'miss'}">${r.hit?'✓':'✗'}</td><td>${r.cum}%</td>
  </tr>`).join('');

  document.getElementById('app').innerHTML=`
   <div class="card">
    <div class="issue">预测期号 <b>${d.next_issue}</b></div>
    <div class="pred-box">
     <div class="pred-label">不组一<span>杀对子</span></div>
     <div class="pred-num">${d.pred}</div>
     <div class="pred-mean">${d.meaning}</div>
    </div>
   </div>
   <div class="card">
    <div class="last-draw">
     上期 <b>${d.last_issue}</b> 开奖 <b>${d.last_draw}</b>
    </div>
   </div>
   <div class="card">
    <div class="acc-row">
     <div class="acc-item"><div class="acc-num">${bt.acc||98.9}%</div><div class="acc-label">近${bt.periods||100}期</div></div>
     <div class="acc-item"><div class="acc-num">98.9%</div><div class="acc-label">近1000期</div></div>
    </div>
   </div>
   <div class="card">
    <div style="font-size:13px;color:#555;margin-bottom:8px;font-weight:600">📋 近${bt.periods||100}期回测明细</div>
    <div class="table-wrap">
     <table>
      <thead><tr><th>期号</th><th>开奖</th><th>不组一</th><th>中</th><th>累计</th></tr></thead>
      <tbody>${rows||'<tr><td colspan=5>暂无数据</td></tr>'}</tbody>
     </table>
    </div>
   </div>
   <div class="footer">
    最近更新 <span>${d.updated||'auto'}</span> · ${d.total}期数据<br>
    数据源: huiniao.top · 每日22:00/23:30/01:00自动更新
   </div>`;
 }catch(e){
  document.getElementById('app').innerHTML=`
   <div class="error">
    <div class="big">📊</div>
    数据加载失败<br><small>${e.message}</small>
    <button class="refresh" onclick="location.reload()">刷新重试</button>
   </div>`;
 }
}
load();
</script>
</body>
</html>
